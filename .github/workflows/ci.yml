name: Unified Operations Suite CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  quality-check:
    name: Automated Quality Gates (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Install Python Server Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn openpyxl pydantic httpx

      - name: Execute Automated Quality-Check Workflow
        shell: powershell
        run: |
          .\scripts\quality_check.ps1 -Check All

  build-mobile-apk:
    name: Build Android APK & Run Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Run Mobile Unit & Widget Tests
        run: |
          cd mobile
          flutter test

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-operations-mobile-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
